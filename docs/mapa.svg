xt x="410.0" y="280" font-family="Inter" font-size="16" font-weight="700" fill="#1E2B38" text-anchor="middle">P2 Registrar avance</text><text x="410.0" y="304" font-family="Inter" font-size="13" font-weight="400" fill="#5B6875" text-anchor="middle">02a → 02d → 02b · HU-02</text><rect x="580" y="250" width="200" height="72" rx="12" fill="#FEF4DC" stroke="#F5B72A" stroke-width="2"/><text x="680.0" y="280" font-family="Inter" font-size="16" font-weight="700" fill="#1E2B38" text-anchor="middle">P1 Turno (resuelto)</text><text x="680.0" y="304" font-family="Inter" font-size="13" font-weight="400" fill="#5B6875" text-anchor="middle">01c · 1.2 por sincronizar</text><rect x="850" y="250" width="200" height="72" rx="12" fill="#E0F7F4" stroke="#35D2C3" stroke-width="2"/><text x="950.0" y="280" font-family="Inter" font-size="16" font-weight="700" fill="#1E2B38" text-anchor="middle">P4 Borrador</text><text x="950.0" y="304" font-family="Inter" font-size="13" font-weight="400" fill="#5B6875" text-anchor="middle">04a → 04b · HU-06</text><rect x="1120" y="250" width="200" height="72" rx="12" fill="#E0F7F4" stroke="#35D2C3" stroke-width="2"/><text x="1220.0" y="280" font-family="Inter" font-size="16" font-weight="700" fill="#1E2B38" text-anchor="middle">P5 Enviar</text><text x="1220.0" y="304" font-family="Inter" font-size="13" font-weight="400" fill="#5B6875" text-anchor="middle">05a → 05b → 05c · HU-07</text><path d="M240 286 L308 286" stroke="#1E2B38" stroke-width="2" fill="none" marker-end="url(#mi)"/><text x="274" y="276" font-family="Inter" font-size="13" font-weight="600" fill="#1E2B38" text-anchor="middle">toca 1.2</text><path d="M510 286 L578 286" stroke="#1E2B38" stroke-width="2" fill="none" marker-end="url(#mi)"/><text x="544" y="276" font-family="Inter" font-size="13" font-weight="600" fill="#1E2B38" text-anchor="middle">Guardar</text><path d="M780 286 L848 286" stroke="#1E2B38" stroke-width="2" fill="none" marker-end="url(#mi)"/><text x="814" y="276" font-family="Inter" font-size="13" font-weight="600" fill="#1E2B38" text-anchor="middle">Revisar</text><path d="M1050 286 L1118 286" stroke="#1E2B38" stroke-width="2" fill="none" marker-end="url(#mi)"/><text x="1084" y="276" font-family="Inter" font-size="13" font-weight="600" fill="#1E2B38" text-anchor="middle">Aprobar</text><path d="M410 250 C410 190 140 190 140 248" stroke="#5B6875" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#mr)"/><text x="275" y="198" font-family="Inter" font-size="13" font-weight="600" fill="#5B6875" text-anchor="middle">← Turno</text><path d="M950 250 C950 190 690 190 690 248" stroke="#5B6875" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#mr)"/><text x="820" y="198" font-family="Inter" font-size="13" font-weight="600" fill="#5B6875" text-anchor="middle">← Turno</text><path d="M1220 250 C1220 130 680 130 680 248" stroke="#1E2B38" stroke-width="2" fill="none" marker-end="url(#mi)"/><text x="950" y="146" font-family="Inter" font-size="13" font-weight="600" fill="#1E2B38" text-anchor="middle">Volver al turno (cierra el día)</text><path d="M1170 250 C1170 190 1000 190 990 248" stroke="#5B6875" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#mr)"/><text x="1085" y="206" font-family="Inter" font-size="13" font-weight="600" fill="#5B6875" text-anchor="middle">← Borrador</text><rect x="40" y="500" width="200" height="72" rx="12" fill="#FDECEC" stroke="#C62828" stroke-width="2"/><text x="140.0" y="530" font-family="Inter" font-size="16" font-weight="700" fill="#1E2B38" text-anchor="middle">P3 Nueva alerta</text><text x="140.0" y="554" font-family="Inter" font-size="13" font-weight="400" fill="#5B6875" text-anchor="middle">03a → 03b error → 03c</text><path d="M110 322 L110 498" stroke="#1E2B38" stroke-width="2" fill="none" marker-end="url(#mi)"/><text x="70" y="370" font-family="Inter" font-size="13" font-weight="600" fill="#1E2B38" text-anchor="middle">Nueva</text><text x="70" y="386" font-family="Inter" font-size="13" font-weight="600" fill="#1E2B38" text-anchor="middle">alerta</text><path d="M170 500 L170 324" stroke="#5B6875" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#mr)"/><text x="222" y="370" font-family="Inter" font-size="13" font-weight="600" fill="#5B6875" text-anchor="middle">Guardar</text><text x="222" y="386" font-family="Inter" font-size="13" font-weight="600" fill="#5B6875" text-anchor="middle">o ← Turno</text><text x="140" y="600" font-family="Inter" font-size="13" font-weight="700" fill="#C62828" text-anchor="middle">A1 · Alerta alta sin foto (HU-03)</text><text x="140" y="618" font-family="Inter" font-size="12" font-weight="400" fill="#5B6875" text-anchor="middle">error junto al campo: «adjunta 1 foto»</text><rect x="310" y="500" width="200" height="72" rx="12" fill="#FDECEC" stroke="#C62828" stroke-width="2"/><text x="410.0" y="530" font-family="Inter" font-size="16" font-weight="700" fill="#1E2B38" text-anchor="middle">P2 con error</text><text x="410.0" y="554" font-family="Inter" font-size="13" font-weight="400" fill="#5B6875" text-anchor="middle">02c · falta foto y texto</text><path d="M380 322 L380 498" stroke="#C62828" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ma)"/><text x="342" y="370" font-family="Inter" font-size="13" font-weight="600" fill="#C62828" text-anchor="middle">Guardar</text><text x="342" y="386" font-family="Inter" font-size="13" font-weight="600" fill="#C62828" text-anchor="middle">vacío</text><path d="M440 500 L440 324" stroke="#C62828" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ma)"/><text x="478" y="370" font-family="Inter" font-size="13" font-weight="600" fill="#C62828" text-anchor="middle">Tomar</text><text x="478" y="386" font-family="Inter" font-size="13" font-weight="600" fill="#C62828" text-anchor="middle">foto</text><text x="410" y="600" font-family="Inter" font-size="13" font-weight="700" fill="#C62828" text-anchor="middle">Estado error del formulario</text><text x="410" y="618" font-family="Inter" font-size="12" font-weight="400" fill="#5B6875" text-anchor="middle">se conserva lo ya ingresado</text><rect x="850" y="500" width="200" height="72" rx="12" fill="#FDECEC" stroke="#C62828" stroke-width="2"/><text x="950.0" y="530" font-family="Inter" font-size="16" font-weight="700" fill="#1E2B38" text-anchor="middle">P4 Sin resolver</text><text x="950.0" y="554" font-family="Inter" font-size="13" font-weight="400" fill="#5B6875" text-anchor="middle">04c · falta frente 1.2</text><path d="M200 322 C230 440 760 420 850 520" stroke="#C62828" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ma)"/><text x="560" y="418" font-family="Inter" font-size="13" font-weight="600" fill="#C62828" text-anchor="middle">Revisar con 1.2 pendiente</text><path d="M850 552 C700 560 520 520 500 324" stroke="#C62828" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ma)"/><text x="640" y="570" font-family="Inter" font-size="13" font-weight="600" fill="#C62828" text-anchor="middle">Ir al frente 1.2</text><text x="950" y="600" font-family="Inter" font-size="13" font-weight="700" fill="#C62828" text-anchor="middle">A2 · Frentes sin resolver (HU-06)</text><text x="950" y="618" font-family="Inter" font-size="12" font-weight="400" fill="#5B6875" text-anchor="middle">lista el frente y lleva a resolverlo</text><rect x="1120" y="500" width="200" height="72" rx="12" fill="#FEF4DC" stroke="#F5B72A" stroke-width="2"/><text x="1220.0" y="530" font-family="Inter" font-size="16" font-weight="700" fill="#1E2B38" text-anchor="middle">P5 Sin red</text><text x="1220.0" y="554" font-family="Inter" font-size="13" font-weight="400" fill="#5B6875" text-anchor="middle">05d · PDF en cola</text><path d="M1220 322 L1220 498" stroke="#B7860F" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#mw)"/><text x="1280" y="370" font-family="Inter" font-size="13" font-weight="600" fill="#B7860F" text-anchor="middle">Confirmar</text><text x="1280" y="386" font-family="Inter" font-size="13" font-weight="600" fill="#B7860F" text-anchor="middle">sin señal</text><text x="1220" y="600" font-family="Inter" font-size="13" font-weight="700" fill="#B7860F" text-anchor="middle">A3 · Envío sin red (HU-07)</text><text x="1220" y="618" font-family="Inter" font-size="12" font-weight="400" fill="#5B6875" text-anchor="middle">se envía solo al detectar señal</text><text x="40" y="690" font-family="Inter" font-size="14" font-weight="400" fill="#5B6875" text-anchor="start">Sin señal al guardar (HU-02): el registro queda «Por sincronizar» en P1 (01c). Estado vacío de P1: 01b, primer día del contrato.</text></svg>